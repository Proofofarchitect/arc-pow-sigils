[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = []

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"

[fmt]
line_length = 110

# Bounded runs so the fuzz/invariant suite stays fast in CI (override via CLI).
[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
